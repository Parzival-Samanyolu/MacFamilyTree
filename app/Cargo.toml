[package]
name = "kintree-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command layer (JSON API) over kintree-core, shared by the Tauri shell and the HTTP dev server"

[dependencies]
kintree-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
